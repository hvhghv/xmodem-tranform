[package]
name = "xmodem-tranform"
version = "0.1.0"
edition = "2021"
description = "XMODEM file transfer over serial port with a web-based GUI and serial terminal"

[dependencies]
# 串口通信
serialport = "4.7"
# 异步运行时
tokio = { version = "1", features = ["full"] }
# Web 服务
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 错误处理
anyhow = "1"
thiserror = "2"
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 打开浏览器
open = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
