[package]
name = "xmodem-tranform"
version = "0.1.0"
edition = "2021"
description = "XMODEM file transfer over serial port with a web-based GUI and serial terminal"

[dependencies]
# 串口通信
#
# 默认启用 libudev：Linux glibc 下可通过 udev 获取串口设备的 USB VID/PID、
# 厂商与产品名，界面上能显示如 "COM16 — USB-SERIAL CH340" 的友好名称。
#
# 但 libudev 是系统库，交叉编译时需要目标架构的 libudev 开发包。
# 部分架构（如 armel / armv7 soft-float）Ubuntu 未提供对应包，
# 此时用 `--no-default-features` 关闭本 feature 即可正常构建，
# 代价是串口枚举退化为扫描 /dev/tty*，不显示设备厂商信息。
serialport = { version = "4.7", default-features = false }
# 异步运行时
tokio = { version = "1", features = ["full"] }
# Web 服务
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 错误处理
anyhow = "1"
thiserror = "2"
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 打开浏览器
open = "5"

[features]
# 默认启用 libudev，与 serialport 的默认行为一致
default = ["libudev"]
# 通过 udev 获取串口设备的详细信息（仅 Linux glibc 有效）
libudev = ["serialport/libudev"]
# 精简构建：用于存储紧张的嵌入式设备
#
# 与完整版的差别：
#   - 前端改用 static/index.mini.html（无主题、无字体选择器）
#   - 不嵌入任何字体（省约 289 KB）
#   - 功能完全一致：终端模拟、ANSI 颜色、XMODEM、导出等都不变
#
# 用法：
#   cargo build --release --no-default-features --features mini
#   （musl 静态链接再加 --target x86_64-unknown-linux-musl）
mini = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# mini 专用：以体积为最高优先级
#
# opt-level = "z"   优先压缩体积（而非速度）
# strip = true      去掉符号表
# panic = "abort"   去掉 unwind 表与清理代码
# lto = "fat"       跨 crate 全局优化，配合 codegen-units = 1 效果最好
[profile.release-mini]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
