name: CI

# 推送与 PR 时构建并测试所有目标平台。
# 产物以 artifact 形式上传，保留 30 天。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# 同一分支的重复触发只保留最新一次，避免浪费 CI 配额。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 统一二进制名，供打包步骤引用。
  BIN_NAME: xmodem-tranform

jobs:
  # ---------------------------------------------------------------------------
  # Windows x64（MSVC，动态链接）
  # ---------------------------------------------------------------------------
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2

      - name: 运行测试
        run: cargo test --release

      - name: 构建
        run: cargo build --release

      - name: 打包
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $stage = "dist/$env:BIN_NAME-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/release/$env:BIN_NAME.exe" $stage
          Copy-Item README.md $stage
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          Write-Host "已打包: $stage.zip"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux glibc：x64 与 arm64 使用原生 runner，armhf/armel/riscv64 交叉编译
  #
  # libudev 说明：
  #   - 除 armel 外，其余 gnu 目标都启用 libudev（需目标架构的 libudev 开发库）
  #   - armel（armv7 soft-float）Ubuntu 未提供 libudev 包，故用 --no-default-features
  #     关闭该 feature，构建出的产物串口枚举不含设备厂商信息
  # ---------------------------------------------------------------------------
  linux-gnu:
    name: Linux gnu ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- 原生构建 ----
          # x64 与 arm64 有原生 runner，可直接运行测试
          - { arch: x64, target: x86_64-unknown-linux-gnu, runner: ubuntu-latest, native: true, libudev: true, apt: '' }
          - { arch: arm64, target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, native: true, libudev: true, apt: '' }
          # ---- 交叉编译 ----
          # armhf 与 riscv64 有对应的 libudev 包，启用该 feature
          - { arch: armhf, target: armv7-unknown-linux-gnueabihf, runner: ubuntu-latest, native: false, libudev: true, apt: gcc-arm-linux-gnueabihf }
          - { arch: riscv64, target: riscv64gc-unknown-linux-gnu, runner: ubuntu-latest, native: false, libudev: true, apt: gcc-riscv64-linux-gnu }
          # armel（armv7 soft-float）：Ubuntu 未提供 armel 版 libudev，
          # 故用 --no-default-features 关闭该 feature 后构建。
          # 代价：串口枚举退化为扫描 /dev/tty*，不显示设备厂商信息。
          - { arch: armel, target: armv7-unknown-linux-gnueabi, runner: ubuntu-latest, native: false, libudev: false, apt: gcc-arm-linux-gnueabi }
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-gnu-${{ matrix.arch }}

      # 原生目标需要 libudev 开发库；交叉目标需要对应架构的 sysroot。
      - name: 安装构建依赖（原生）
        if: matrix.native && matrix.libudev
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev

      # 交叉编译：安装交叉编译器，并准备目标架构的 libudev sysroot。
      # 做法是从 Ubuntu ports 仓库下载目标架构的 deb 包并解压到独立
      # sysroot，再用 PKG_CONFIG_* 变量让 pkg-config 在其中查找 libudev。
      #
      # 三个坑：
      #   1. apt-get download pkg:<arch> 要求该外部架构已通过
      #      dpkg --add-architecture 注册，否则报 "Unable to locate package"。
      #   2. armhf 与 riscv64 是 Ubuntu 的 **ports** 架构，只发布在
      #      ports.ubuntu.com；archive.ubuntu.com 上没有它们的索引（404）。
      #   3. 反过来 ports 源上也没有 amd64，所以不能把两类源混在一份
      #      sourcelist 里 —— 否则两边互相 404。这里分两步：
      #        a. host 包（pkg-config、交叉 gcc）走默认源；
      #        b. 外部架构 deb 走单独的 ports-only 源，并用 [arch=...]
      #           限定，只抓目标架构的索引。
      - name: 安装构建依赖（交叉）
        if: ${{ !matrix.native }}
        shell: bash
        run: |
          set -euo pipefail

          # 交叉编译器与 pkg-config 走默认源（host 架构）
          sudo apt-get update
          sudo apt-get install -y pkg-config ${{ matrix.apt }}

          if [ '${{ matrix.libudev }}' = 'true' ]; then
            # 架构名到 Ubuntu deb 架构的映射
            case '${{ matrix.arch }}' in
              armhf)   deb_arch=armhf ;;
              riscv64) deb_arch=riscv64 ;;
              *)       echo "未配置的架构: ${{ matrix.arch }}"; exit 1 ;;
            esac

            # 必须先注册外部架构，apt 才能找到并下载该架构的包
            sudo dpkg --add-architecture "$deb_arch"

            # ports-only 源，用 [arch=] 限定，避免去抓 amd64 索引而 404
            cat > /tmp/ports-only.list <<EOF
          deb [arch=${deb_arch}] http://ports.ubuntu.com/ubuntu-ports/ noble main universe
          deb [arch=${deb_arch}] http://ports.ubuntu.com/ubuntu-ports/ noble-updates main universe
          deb [arch=${deb_arch}] http://ports.ubuntu.com/ubuntu-ports/ noble-security main universe
          EOF
            sed -i 's/^[[:space:]]*//' /tmp/ports-only.list

            PORTS_OPTS=(
              -o Dir::Etc::sourcelist=/tmp/ports-only.list
              -o Dir::Etc::sourceparts=-
              -o APT::Get::List-Cleanup=0
            )

            sudo apt-get "${PORTS_OPTS[@]}" update

            sysroot="$PWD/.sysroot/${{ matrix.arch }}"
            mkdir -p "$sysroot"
            cd "$sysroot"

            # 下载并解压 libudev 开发包与其运行时库
            for pkg in libudev-dev libudev1; do
              apt-get "${PORTS_OPTS[@]}" download "$pkg:$deb_arch"
            done
            for deb in *.deb; do
              dpkg-deb -x "$deb" "$sysroot"
            done
            rm -f *.deb

            echo "已准备 $deb_arch sysroot: $sysroot"
            find "$sysroot" -name 'libudev*' | head -20
          fi

      # 交叉编译必须显式指定目标链接器，否则 Cargo 会退回宿主的 cc，
      # 导致 "incompatible with elf64-x86-64" 之类的链接错误。
      - name: 配置链接器（交叉）
        if: ${{ !matrix.native }}
        shell: bash
        run: |
          set -euo pipefail

          target_upper="$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')"
          # matrix.apt 形如 gcc-arm-linux-gnueabihf，去掉 gcc- 前缀即为工具链前缀
          apt_pkg='${{ matrix.apt }}'
          cc_prefix="${apt_pkg#gcc-}"
          linker="${cc_prefix}-gcc"
          command -v "$linker" >/dev/null 2>&1 || {
            echo "::error::未找到交叉链接器 $linker"
            exit 1
          }
          echo "CARGO_TARGET_${target_upper}_LINKER=$linker" >> "$GITHUB_ENV"
          echo "链接器: $linker"

      - name: 运行测试（仅原生目标）
        # 交叉编译产物无法在当前 runner 上执行，测试已在 x64/arm64 原生通过。
        if: matrix.native
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ matrix.libudev }}' = 'true' ]; then
            cargo test --release --target ${{ matrix.target }}
          else
            cargo test --release --target ${{ matrix.target }} --no-default-features
          fi

      - name: 构建
        shell: bash
        run: |
          set -euo pipefail

          features=''
          if [ '${{ matrix.libudev }}' = 'false' ]; then
            features='--no-default-features'
          fi

          # 交叉编译时把 libudev sysroot 传给 pkg-config
          if [ '${{ matrix.native }}' = 'false' ] && [ '${{ matrix.libudev }}' = 'true' ]; then
            sysroot="$PWD/.sysroot/${{ matrix.arch }}"
            # 找到 pkgconfig 目录（deb 解压后位于 usr/lib/<triplet>/pkgconfig）
            pkgconfig_dir="$(find "$sysroot" -type d -name pkgconfig | head -1)"
            export PKG_CONFIG_ALLOW_CROSS=1
            export PKG_CONFIG_DIR=''
            export PKG_CONFIG_LIBDIR="$pkgconfig_dir"
            export PKG_CONFIG_SYSROOT_DIR="$sysroot"
            echo "PKG_CONFIG_LIBDIR=$PKG_CONFIG_LIBDIR"
          fi

          cargo build --release --target ${{ matrix.target }} $features

      - name: 打包
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          suffix=''
          if [ '${{ matrix.libudev }}' = 'false' ]; then
            suffix='-nolibudev'
          fi
          stage="dist/$BIN_NAME-$version-linux-${{ matrix.arch }}-gnu$suffix"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/$BIN_NAME" "$stage/"
          cp README.md "$stage/"
          tar -czf "$stage.tar.gz" -C dist "$(basename "$stage")"
          echo "已打包: $stage.tar.gz"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-gnu-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux musl：全部在 x86_64 runner 上构建，各出动态与静态两个版本。
  #
  # 为什么 arm64 也用 ubuntu-latest 交叉编译而不用原生 arm runner：
  #   cross-software 发布的工具链是在 ubuntu-22.04 (x86_64) 上构建的，
  #   其 bin/ 下的 *-gcc 本身是 x86_64 可执行文件，在 arm64 runner 上
  #   会报 "Exec format error"。因此所有 musl 目标统一在 x86_64 上构建。
  #
  # musl 目标不依赖 libudev（serialport 用 not(target_env = "musl") 门控），
  # 因此交叉编译无需任何系统库，只需 musl 交叉工具链。
  #
  # 该工具链只提供 soft-float 的 arm-linux-musleabi，没有 hard-float 变体，
  # 因此不构建 armhf（armv7-unknown-linux-musleabihf）。
  # ---------------------------------------------------------------------------
  linux-musl:
    name: Linux musl ${{ matrix.arch }} (${{ matrix.linkage }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 每个架构显式列出 dynamic 与 static 两条，避免依赖 include 与
        # 其它 matrix 键的隐式组合语义（那样容易因改动而意外增减任务）。
        # test 表示该目标能否在当前 runner 上直接运行测试。
        include:
          # ---- x64 ----
          - { arch: x64, target: x86_64-unknown-linux-musl, linkage: dynamic, test: false }
          - { arch: x64, target: x86_64-unknown-linux-musl, linkage: static, test: true }
          # ---- arm64 ----
          - { arch: arm64, target: aarch64-unknown-linux-musl, linkage: dynamic, test: false }
          - { arch: arm64, target: aarch64-unknown-linux-musl, linkage: static, test: false }
          # ---- arm（soft-float）----
          - { arch: arm, target: armv7-unknown-linux-musleabi, linkage: dynamic, test: false }
          - { arch: arm, target: armv7-unknown-linux-musleabi, linkage: static, test: false }
          # ---- riscv64 ----
          - { arch: riscv64, target: riscv64gc-unknown-linux-musl, linkage: dynamic, test: false }
          - { arch: riscv64, target: riscv64gc-unknown-linux-musl, linkage: static, test: false }
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-musl-${{ matrix.arch }}-${{ matrix.linkage }}

      # musl 工具链统一使用 hvhghv/cross-software 的 v15.1.0-musl-gcc release。
      # 资产命名：musl-toolchain-{arch}-{variant}.tar.gz
      #   arch:    arm | riscv64 | aarch64 | x86_64
      #   variant: lto-nodebug（启用 LTO）| nodebug | debug
      # 压缩包内第一级目录为 musl-toolchain-{arch}-{variant}，结构示例：
      #   musl-toolchain-arm-lto-nodebug/bin/arm-linux-musleabi-gcc
      #   musl-toolchain-x86_64-lto-nodebug/bin/x86_64-linux-musl-gcc
      #
      # 不使用 apt 的 musl-tools：它只提供 libc.a（静态），没有 libc.so，
      # 动态链接会报 "cannot find libgcc_s.so.1"。
      - name: 安装 musl 工具链
        shell: bash
        run: |
          set -euo pipefail

          toolchain_tag='v15.1.0-musl-gcc'
          toolchain_variant='lto-nodebug'

          # 架构名到工具链资产名与编译器前缀的映射
          case '${{ matrix.arch }}' in
            x64)     pkg_arch=x86_64  ; cc_prefix=x86_64-linux-musl ;;
            arm64)   pkg_arch=aarch64 ; cc_prefix=aarch64-linux-musl ;;
            arm)     pkg_arch=arm     ; cc_prefix=arm-linux-musleabi ;;
            riscv64) pkg_arch=riscv64 ; cc_prefix=riscv64-linux-musl ;;
            *)       echo "未配置的架构: ${{ matrix.arch }}"; exit 1 ;;
          esac

          asset="musl-toolchain-${pkg_arch}-${toolchain_variant}.tar.gz"
          toolchain_url="https://github.com/hvhghv/cross-software/releases/download/${toolchain_tag}/${asset}"
          echo "下载工具链: $toolchain_url"
          curl -fsSL "$toolchain_url" -o /tmp/musl-toolchain.tar.gz

          # 解压到 $HOME，保留压缩包内的第一级目录
          mkdir -p "$HOME/musl"
          tar -xzf /tmp/musl-toolchain.tar.gz -C "$HOME/musl"

          toolchain_root="$HOME/musl/musl-toolchain-${pkg_arch}-${toolchain_variant}"
          if [ ! -d "$toolchain_root" ]; then
            echo "未找到预期的工具链目录，实际内容："
            ls -la "$HOME/musl"
            exit 1
          fi

          echo "$toolchain_root/bin" >> "$GITHUB_PATH"
          echo "MUSL_CC=$toolchain_root/bin/${cc_prefix}-gcc" >> "$GITHUB_ENV"
          echo "工具链目录: $toolchain_root"
          ls "$toolchain_root/bin" | head -20

      - name: 配置链接器
        shell: bash
        run: |
          set -euo pipefail

          target_upper="$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')"
          # 工具链的编译器已按目标 ABI 配置好（arm 为 soft-float），
          # 无需额外传 -mfloat-abi。
          echo "CARGO_TARGET_${target_upper}_LINKER=$MUSL_CC" >> "$GITHUB_ENV"
          echo "链接器: $MUSL_CC"

      - name: 运行测试（仅可在本机执行的目标）
        # 动态链接的 musl 产物需要 /lib/ld-musl-<arch>.so.1，
        # Ubuntu runner 上没有该 loader，因此只有静态 x64 能直接运行。
        if: matrix.test
        shell: bash
        run: |
          set -euo pipefail
          RUSTFLAGS='-C target-feature=+crt-static' cargo test --release --target ${{ matrix.target }}

      - name: 构建
        shell: bash
        run: |
          set -euo pipefail

          # musl 默认静态链接，动态链接需显式关闭 crt-static
          if [ '${{ matrix.linkage }}' = 'static' ]; then
            rustflags='-C target-feature=+crt-static'
          else
            rustflags='-C target-feature=-crt-static'
          fi

          export RUSTFLAGS="$rustflags"
          echo "RUSTFLAGS=$RUSTFLAGS"

          cargo build --release --target ${{ matrix.target }}

      - name: 校验链接方式
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/$BIN_NAME"

          # 用 readelf 检查是否含 INTERP 段（动态）或完全静态
          if command -v readelf >/dev/null 2>&1; then
            if readelf -l "$bin" 2>/dev/null | grep -q 'INTERP'; then
              actual='dynamic'
            else
              actual='static'
            fi
            echo "链接方式: $actual（期望 ${{ matrix.linkage }}）"
            if [ "$actual" != '${{ matrix.linkage }}' ]; then
              echo "::error::链接方式与期望不符"
              exit 1
            fi
          else
            echo "readelf 不可用，跳过链接方式校验"
          fi

      - name: 打包
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          stage="dist/$BIN_NAME-$version-linux-${{ matrix.arch }}-musl-${{ matrix.linkage }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/$BIN_NAME" "$stage/"
          cp README.md "$stage/"
          tar -czf "$stage.tar.gz" -C dist "$(basename "$stage")"
          echo "已打包: $stage.tar.gz"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-musl-${{ matrix.arch }}-${{ matrix.linkage }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux musl mini：精简构建（不嵌字体 + release-mini profile），全部静态链接。
  # 与 linux-musl 的差异仅在于构建命令与产物名，工具链配置完全一致。
  # ---------------------------------------------------------------------------
  linux-musl-mini:
    name: Linux musl mini ${{ matrix.arch }} (static)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # test 表示该目标能否在当前 runner 上直接运行测试
        # （静态 x64 可直接运行，其余架构无法执行）
        include:
          - { arch: x64,     target: x86_64-unknown-linux-musl,      test: true }
          - { arch: arm64,   target: aarch64-unknown-linux-musl,     test: false }
          - { arch: arm,     target: armv7-unknown-linux-musleabi,   test: false }
          - { arch: riscv64, target: riscv64gc-unknown-linux-musl,   test: false }
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-musl-mini-${{ matrix.arch }}

      # 工具链说明同 linux-musl job：musl-tools 只有 libc.a，无法满足需求；
      # 这里统一使用 cross-software 工具链以保证 ABI 一致。
      - name: 安装 musl 工具链
        shell: bash
        run: |
          set -euo pipefail

          toolchain_tag='v15.1.0-musl-gcc'
          toolchain_variant='lto-nodebug'

          case '${{ matrix.arch }}' in
            x64)     pkg_arch=x86_64  ; cc_prefix=x86_64-linux-musl ;;
            arm64)   pkg_arch=aarch64 ; cc_prefix=aarch64-linux-musl ;;
            arm)     pkg_arch=arm     ; cc_prefix=arm-linux-musleabi ;;
            riscv64) pkg_arch=riscv64 ; cc_prefix=riscv64-linux-musl ;;
            *)       echo "未配置的架构: ${{ matrix.arch }}"; exit 1 ;;
          esac

          asset="musl-toolchain-${pkg_arch}-${toolchain_variant}.tar.gz"
          toolchain_url="https://github.com/hvhghv/cross-software/releases/download/${toolchain_tag}/${asset}"
          echo "下载工具链: $toolchain_url"
          curl -fsSL "$toolchain_url" -o /tmp/musl-toolchain.tar.gz

          mkdir -p "$HOME/musl"
          tar -xzf /tmp/musl-toolchain.tar.gz -C "$HOME/musl"

          toolchain_root="$HOME/musl/musl-toolchain-${pkg_arch}-${toolchain_variant}"
          if [ ! -d "$toolchain_root" ]; then
            echo "未找到预期的工具链目录，实际内容："
            ls -la "$HOME/musl"
            exit 1
          fi

          echo "$toolchain_root/bin" >> "$GITHUB_PATH"
          echo "MUSL_CC=$toolchain_root/bin/${cc_prefix}-gcc" >> "$GITHUB_ENV"
          echo "工具链目录: $toolchain_root"

      - name: 配置链接器
        shell: bash
        run: |
          set -euo pipefail

          target_upper="$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')"
          echo "CARGO_TARGET_${target_upper}_LINKER=$MUSL_CC" >> "$GITHUB_ENV"
          echo "链接器: $MUSL_CC"

      - name: 运行测试（仅可在本机执行的目标）
        if: matrix.test
        shell: bash
        run: |
          set -euo pipefail
          RUSTFLAGS='-C target-feature=+crt-static' \
            cargo test --release --no-default-features --features mini --target ${{ matrix.target }}

      - name: 构建
        shell: bash
        run: |
          set -euo pipefail

          # mini 一律静态链接
          export RUSTFLAGS='-C target-feature=+crt-static'
          echo "RUSTFLAGS=$RUSTFLAGS"

          cargo build \
            --profile release-mini \
            --no-default-features \
            --features mini \
            --target ${{ matrix.target }}

      - name: 校验链接方式
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release-mini/$BIN_NAME"

          if command -v readelf >/dev/null 2>&1; then
            if readelf -l "$bin" 2>/dev/null | grep -q 'INTERP'; then
              actual='dynamic'
            else
              actual='static'
            fi
            echo "链接方式: $actual（期望 static）"
            if [ "$actual" != 'static' ]; then
              echo "::error::mini 版应为静态链接"
              exit 1
            fi
          else
            echo "readelf 不可用，跳过链接方式校验"
          fi

      - name: 校验体积
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release-mini/$BIN_NAME"
          size_bytes=$(stat -c%s "$bin")
          size_mb=$((size_bytes / 1024 / 1024))
          echo "mini 产物体积: ${size_mb} MB (${size_bytes} 字节)"
          # 精简版应显著小于完整版；超过 5 MB 说明 mini 特性或 profile 未生效
          if [ "$size_bytes" -gt 5242880 ]; then
            echo "::error::mini 产物过大（${size_mb} MB），请检查 mini feature 与 release-mini profile"
            exit 1
          fi

      - name: 打包
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          stage="dist/$BIN_NAME-$version-linux-${{ matrix.arch }}-musl-static-mini"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release-mini/$BIN_NAME" "$stage/"
          cp README.md "$stage/"
          tar -czf "$stage.tar.gz" -C dist "$(basename "$stage")"
          echo "已打包: $stage.tar.gz"
          ls -lh "$stage.tar.gz"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-musl-mini-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
